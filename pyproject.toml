[project]
name = "weather-graph"
version = "0.1.0"
description = "Standalone demo: NL -> validated SPARQL over a small weather RDF graph, using Mellea (structured + self-validating generation) and a BeeAI RequirementAgent on Ollama granite4:micro."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    "beeai-framework>=0.1",
    "kif-lib>=0.13,<1",
    "mellea>=0.1",
    "neo4j>=5.24,<7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rdflib>=7.4.0,<8",
]

[project.scripts]
weather-graph = "weather_graph.demo:main"
weather-graph-neo4j = "weather_graph.demo_neo4j:main"
weather-graph-kif = "weather_graph.demo_kif:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_graph"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
