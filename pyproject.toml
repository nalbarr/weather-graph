[project]
name = "weather-graph"
version = "0.1.0"
description = "Standalone demo: NL -> validated SPARQL over a small weather RDF graph. Default agent backend is pydantic-ai, with a LangGraph variant, on Ollama granite4:micro; the original BeeAI + Mellea approach is an opt-in extra (see the beeai dependency group and AGENT_BACKEND)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    "kif-lib>=0.13,<1",
    "langchain-ollama>=1.1,<2",
    "langgraph>=1.2,<2",
    "neo4j>=5.24,<7",
    "pydantic>=2.7",
    "pydantic-ai>=2.40,<3",
    "python-dotenv>=1.0",
    "rdflib>=7.4.0,<8",
]

[project.optional-dependencies]
# Opt-in legacy agent backend (AGENT_BACKEND=beeai) — demoted out of the default install because
# Mellea's instruct-validate-repair loop makes it measurably slower than the default/variant
# backends above. Install with `uv sync --extra beeai`. See plans/PLAN_AGENTS.md.
beeai = [
    "beeai-framework>=0.1",
    "mellea>=0.1",
]

# Opt-in second KIF Store backend (`uv run weather-graph-kif-llm`), an LLM standing in for the
# SPARQL store. Install with `uv sync --extra kif-llm`. Just the one entry: the `LLM_Store` code
# itself is vendored under src/weather_graph/kif/_vendor/ (upstream is not pip-installable — see
# that package's header and analysis/kif_llm_analysis.md), and its other real dependencies
# (langchain-ollama, httpx, tenacity) are already core dependencies at compatible versions.
kif-llm = [
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.scripts]
weather-graph = "weather_graph.demo:main"
weather-graph-neo4j = "weather_graph.demo_neo4j:main"
weather-graph-kif = "weather_graph.demo_kif:main"
weather-graph-kif-llm = "weather_graph.demo_kif_llm:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_graph"]

[tool.ruff]
target-version = "py313"
line-length = 100
# Vendored upstream source (IBM/kif-llm, Apache-2.0) — kept as close to verbatim as possible so it
# stays diffable against upstream, so it is not held to this repo's lint rules. See that package's
# header for the three deliberate patches.
extend-exclude = ["src/weather_graph/kif/_vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
